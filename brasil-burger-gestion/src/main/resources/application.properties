# Configuration de l'application pour la gestion des commandes et livraisons
# Base de donnees: Neon PostgreSQL

# Parametres de connexion a la base de donnees Neon
spring.datasource.url=jdbc:postgresql://ep-raspy-glitter-a417bp77-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_vLxQ5bukUE3B
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration de JPA
# IMPORTANT: Utiliser 'validate' au lieu de 'update' pour ne pas modifier la base de donnees distante
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Strategie de nommage pour correspondre au schema PostgreSQL (snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configuration du serveur
server.port=8080

# Autres configurations
logging.level.org.springframework=INFO
logging.level.com.brasilburger=DEBUG